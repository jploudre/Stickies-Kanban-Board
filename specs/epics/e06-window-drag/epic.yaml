# Epic e06 — Draggable window titlebar + drop window titling

- **id:** e06
- **title:** Window titlebar drag (core) and remove window titling (stickies)
- **status:** in_progress
- **release:** 2.0.0
- **summary:** Make the Mac window titlebar a drag handle (core `MF.Window`), and
  remove the leftover "title the window" capability from the Single Board app so
  the titlebar is a clean, non-editable drag surface.

## Stories

- e06s01 — Core: draggable titlebar on `MF.Window`
- e06s02 — App: remove the editable board-title window titlebar (stickies)

## Context

Two coupled changes:

1. **Remove window titling (app).** The board titlebar currently doubles as the
   board-title editor (a `span.title` + `input.edit` wired via click/keydown/blur
   handlers). This is a leftover from when the app had multiple boards. The user
   wants the ability to title the window removed; the titlebar should show a
   static, non-editable title.

2. **Add drag (core).** Clicking and dragging the window titlebar should move the
   window — a reusable `MF.Window`/`MF.WindowManager` feature, not an app-specific
   one. The board is currently a flow-layout window (centered via `margin: 28px auto`);
   dragging converts it to an absolutely-positioned window at its current location.

## Risks

- The board is the page's only in-flow sizing element; once it becomes absolutely
  positioned the desktop background can collapse, so the shared desktop must
  guarantee a full-height background (`body { min-height: 100vh }`).
- Core drag must not interfere with the existing note drag (`drag.js`), which also
  binds `document` `mousemove`/`mouseup`.
- Removing the board title editor must not break board persistence or the
  document title (board model keeps `title`).

## Verification

- `make verify` green end-to-end.
- Manual UAT: drag the board window by its titlebar; it follows the mouse; no text
  is selected while dragging; notes/lists still drag; the titlebar no longer opens
  an edit field on click.
