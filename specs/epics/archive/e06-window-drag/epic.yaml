# Key risks resolved during implementation (from original capsule):
# - The board was the page's only in-flow element; once absolutely positioned
#   the desktop background collapsed, so the shared desktop guarantees a
#   full-height background (body { min-height: 100vh }).
# - Core titlebar drag must not interfere with the existing note drag (drag.js),
#   which also binds document mousemove/mouseup.
# - Removing the board title editor must not break board persistence or the
#   document title (board model keeps `title`).
